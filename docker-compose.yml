services:
  mysql:
    image: mysql:8.4
    container_name: automanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: automanager
      MYSQL_USER: automanager
      MYSQL_PASSWORD: automanager
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - automanager-mysql:/var/lib/mysql

volumes:
  automanager-mysql:
